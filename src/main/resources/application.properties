spring.application.name=desafio-bancario-correcao
server.port=${SERVER_PORT:8082}

# PostgreSQL local. Variáveis de ambiente substituem os valores padrão.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agencia_bancaria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuração didática. Em produção, utilize uma ferramenta de migração.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e documento OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Custo do BCrypt. O valor 12 significa aproximadamente 2ˆ12 unidades de trabalho.
# Em produção, medimos essa performance para + ou -
security.password.bcrypt-strenght=${BCRYPT_STRENGHT:12}

# A chave abaixo existe somente para a execução local da aula. Em qualquer
# ambiente compartilhado, defina JWT_SECRET com Base64 de pelo menos 32 bytes.
security.jwt.secret=${JWT_SECRET:c2VncmVkby1qd3QtZGlkYXRpY28tMzItYnl0ZXMtMTIzNDU2Nzg=}
security.jwt.issuer=${JWT_ISSUER:agencia-bancaria-api}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

