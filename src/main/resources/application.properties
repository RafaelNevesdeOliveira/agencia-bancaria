spring.application.name=desafio-bancario-correcao
server.port=${SERVER_PORT:8082}

# PostgreSQL local. Variáveis de ambiente substituem os valores padrão.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agencia_bancaria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuração didática. Em produção, utilize uma ferramenta de migração.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e documento OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

